<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textor TTS pipeline — architecture</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d23; --muted:#5b6270; --card:#f5f6f8; --border:#dde1e6;
    --accent:#2f6fed; --accent2:#188a5e; --warn:#b5520c; --risk:#8a1f1f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --fg:#e8eaed; --muted:#9aa2b1; --card:#1d2026; --border:#2b2f37;
      --accent:#6fa0ff; --accent2:#4fd39a; --warn:#e2a158; --risk:#ff8a8a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --fg:#e8eaed; --muted:#9aa2b1; --card:#1d2026; --border:#2b2f37;
    --accent:#6fa0ff; --accent2:#4fd39a; --warn:#e2a158; --risk:#ff8a8a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px;
  }
  main{max-width:980px; margin:0 auto;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  p.sub{color:var(--muted); margin:0 0 28px; font-size:0.95rem;}
  section{margin-bottom:40px;}
  h2{font-size:1.1rem; margin:0 0 4px;}
  p.caption{color:var(--muted); margin:0 0 16px; font-size:0.9rem; max-width:720px;}
  .diagram-wrap{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px; overflow-x:auto;
  }
  svg{display:block; min-width:640px; width:100%; height:auto;}
  .box{fill:var(--card); stroke:var(--border); stroke-width:1.5;}
  .box-accent{stroke:var(--accent);}
  .box-accent2{stroke:var(--accent2);}
  .box-warn{stroke:var(--warn);}
  .box-risk{stroke:var(--risk); stroke-dasharray:5 4;}
  text{fill:var(--fg); font-family:inherit;}
  .label{font-size:13px; font-weight:600;}
  .sublabel{font-size:11px; fill:var(--muted);}
  .arrow{stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#arrowhead);}
  .tag{font-size:10.5px; font-weight:600;}
  .tag-accent{fill:var(--accent);}
  .tag-accent2{fill:var(--accent2);}
  .tag-warn{fill:var(--warn);}
  .tag-risk{fill:var(--risk);}
  footer{color:var(--muted); font-size:0.85rem; margin-top:8px;}
</style>
</head>
<body>
<main>
  <h1>Textor TTS pipeline</h1>
  <p class="sub">Proposed architecture and alternatives.</p>

  <section>
    <h2>Proposed architecture &amp; alternatives</h2>
    <p class="caption">Main path in solid boxes; swappable alternative components attached below each stage.</p>
    <div class="diagram-wrap">
      <svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/>
          </marker>
        </defs>

        <!-- main pipeline row -->
        <rect class="box box-accent" x="20" y="40" width="190" height="60" rx="10"/>
        <text class="label" x="115" y="65" text-anchor="middle">Text editor</text>
        <text class="sublabel" x="115" y="82" text-anchor="middle">EditText / select text</text>

        <path class="arrow" d="M210,70 H270"/>

        <rect class="box box-accent2" x="270" y="40" width="200" height="60" rx="10"/>
        <text class="label" x="370" y="65" text-anchor="middle">Correction LLM</text>
        <text class="sublabel" x="370" y="82" text-anchor="middle">small, on-device</text>

        <path class="arrow" d="M470,70 H530"/>

        <rect class="box box-accent" x="530" y="40" width="200" height="60" rx="10"/>
        <text class="label" x="630" y="65" text-anchor="middle">Primary TTS model</text>
        <text class="sublabel" x="630" y="82" text-anchor="middle">Piper (neural voice)</text>

        <path class="arrow" d="M730,70 H790"/>

        <rect class="box" x="790" y="40" width="130" height="60" rx="10"/>
        <text class="label" x="855" y="65" text-anchor="middle">AudioTrack</text>
        <text class="sublabel" x="855" y="82" text-anchor="middle">playback</text>

        <!-- connector down to alternatives -->
        <path class="arrow" d="M370,100 V140" marker-end="none" stroke-dasharray="3 3"/>
        <path class="arrow" d="M630,100 V140" marker-end="none" stroke-dasharray="3 3"/>

        <!-- correction LLM alternatives -->
        <text class="tag tag-accent2" x="270" y="160">Correction LLM runtime options</text>
        <rect class="box" x="270" y="170" width="200" height="48" rx="8"/>
        <text class="label" x="370" y="190" text-anchor="middle" style="font-size:12px">llama.cpp (Android JNI)</text>
        <text class="sublabel" x="370" y="205" text-anchor="middle">model-agnostic, more setup</text>

        <rect class="box" x="270" y="226" width="200" height="48" rx="8"/>
        <text class="label" x="370" y="246" text-anchor="middle" style="font-size:12px">MediaPipe LLM Inference</text>
        <text class="sublabel" x="370" y="261" text-anchor="middle">Google-supported, pinned models</text>

        <rect class="box box-warn" x="270" y="282" width="200" height="48" rx="8"/>
        <text class="label" x="370" y="302" text-anchor="middle" style="font-size:12px">Skip correction entirely</text>
        <text class="sublabel" x="370" y="317" text-anchor="middle">fallback for low-RAM devices</text>

        <!-- model candidates -->
        <text class="sublabel" x="370" y="346">Candidate models: SmolLM2-1.7B, Gemma-2 2B, Phi-3-mini (Q4)</text>

        <!-- TTS alternatives -->
        <text class="tag tag-accent" x="530" y="160">Primary TTS runtime options</text>
        <rect class="box" x="530" y="170" width="200" height="48" rx="8"/>
        <text class="label" x="630" y="190" text-anchor="middle" style="font-size:12px">sherpa-onnx (Piper voices)</text>
        <text class="sublabel" x="630" y="205" text-anchor="middle">recommended — Android AAR</text>

        <rect class="box" x="530" y="226" width="200" height="48" rx="8"/>
        <text class="label" x="630" y="246" text-anchor="middle" style="font-size:12px">ONNX Runtime Mobile (raw)</text>
        <text class="sublabel" x="630" y="261" text-anchor="middle">more control, much more work</text>

        <rect class="box box-warn" x="530" y="282" width="200" height="48" rx="8"/>
        <text class="label" x="630" y="302" text-anchor="middle" style="font-size:12px">Android system TextToSpeech</text>
        <text class="sublabel" x="630" y="317" text-anchor="middle">zero-integration fallback, day 1</text>

        <text class="sublabel" x="630" y="346">Pipeline is chunked per sentence; correction runs concurrently with playback of the prior chunk.</text>

        <text class="sublabel" x="20" y="400">Solid outline = main path. Dashed outline = fallback/degraded mode.</text>
      </svg>
    </div>
  </section>

  <footer>Textor — generated reference diagram, no external data embedded.</footer>
</main>
</body>
</html>
